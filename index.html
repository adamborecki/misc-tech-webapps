<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="5; url=https://adamborecki.github.io/mus244-unit1-review/" />
  <title>Moved — misc-tech-webapps</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --fg: #f2f3f5;
      --muted: #9aa0ab;
      --accent: #7dd3fc;
      --card: #171a21;
      --border: #2a2f3a;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f7f8;
        --fg: #16181d;
        --muted: #5b6270;
        --accent: #0b6fa8;
        --card: #ffffff;
        --border: #e3e5e9;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 460px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
    }
    .emoji { font-size: 2.5rem; margin-bottom: 8px; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 20px; }
    code {
      background: var(--border);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 0.9em;
    }
    a.btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 10px;
      background: var(--accent);
      color: #061018;
      text-decoration: none;
      font-weight: 600;
    }
    .note { margin-top: 16px; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">📦➡️🎓</div>
    <h1>This repo moved</h1>
    <p>
      <code>misc-tech-webapps</code> was renamed and repurposed. Its live content is now at
      <strong>mus244-unit1-review</strong> — interactive review modules for MUS 244 Unit 1 (Acoustics &amp; Synthesis).
    </p>
    <a class="btn" href="https://adamborecki.github.io/mus244-unit1-review/">Go to mus244-unit1-review →</a>
    <p class="note">Redirecting automatically in a few seconds…</p>
  </div>
</body>
</html>
